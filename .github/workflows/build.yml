name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Patch react-native-screens iOS 26
        run: |
          grep -rl "usesNewAndroidHeaderHeightImplementation" node_modules/react-native-screens/ | while read f; do
            sed -i '' "s/'usesNewAndroidHeaderHeightImplementation' in compatibilityFlags/'usesNewAndroidHeaderHeightImplementation' in (compatibilityFlags || {})/g" "$f"
            echo "Patched: $f"
          done

      - name: Bundle JavaScript
        run: |
          NODE_ENV=production node node_modules/.bin/react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/SySlate/main.jsbundle \
            --assets-dest $RUNNER_TEMP/rn-assets

      - name: Patch bundle for iOS 26
        run: |
          sed -i '' -E "s/'usesNewAndroidHeaderHeightImplementation'in ([a-zA-Z_\$]+)\.compatibilityFlags/'usesNewAndroidHeaderHeightImplementation'in (\1.compatibilityFlags||{})/g" ios/SySlate/main.jsbundle
          echo "Patch result:"
          grep -n "compatibilityFlags" ios/SySlate/main.jsbundle | head -5

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Ensure Info.plist file sharing keys
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/SySlate/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/SySlate/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/SySlate/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/SySlate/Info.plist
          echo "Info.plist file sharing keys set"

      - name: Generate app icons
        run: |
          ICON="$GITHUB_WORKSPACE/icon.jpg"
          ICONSET="$GITHUB_WORKSPACE/ios/SySlate/Images.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sizes=(20 29 40 58 60 76 80 87 120 152 167 180 1024)
          for s in "${sizes[@]}"; do
            sips -z $s $s "$ICON" --out "$ICONSET/icon_${s}.png" 2>/dev/null
          done
          cat > "$ICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"icon_40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"icon_60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"icon_58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"icon_87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"icon_80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"icon_120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"icon_120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"icon_180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"icon_20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"icon_40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"icon_29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"icon_58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"icon_40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"icon_80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"icon_76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"icon_152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"icon_167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"icon_1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          EOF
          echo "Icons generated"

      - name: Disable code signing
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' SySlate.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          cd ios
          xcrun xcodebuild \
            -workspace SySlate.xcworkspace \
            -scheme SySlate \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/SySlate.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            GENERATE_INFOPLIST_FILE=NO \
            SKIP_BUNDLING=1 \
            clean archive
            
          echo "=== Copying JS bundle into app ==="
          cp $GITHUB_WORKSPACE/ios/SySlate/main.jsbundle \
            $RUNNER_TEMP/SySlate.xcarchive/Products/Applications/SySlate.app/main.jsbundle

          echo "=== Verifying ==="
          ls -la $RUNNER_TEMP/SySlate.xcarchive/Products/Applications/SySlate.app/main.jsbundle

          cd $RUNNER_TEMP/SySlate.xcarchive/Products
          mv Applications Payload
          zip -r $RUNNER_TEMP/SySlate.ipa Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SySlate-unsigned
          path: ${{ runner.temp }}/SySlate.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ runner.temp }}/SySlate.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}