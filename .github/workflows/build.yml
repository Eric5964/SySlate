name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle JavaScript
        run: |
          node node_modules/.bin/react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output $GITHUB_WORKSPACE/ios/SySlate/main.jsbundle \
            --assets-dest $RUNNER_TEMP/rn-assets
        env:
          NODE_ENV: production

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Disable code signing
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' SySlate.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          cd ios
          xcrun xcodebuild \
            -workspace SySlate.xcworkspace \
            -scheme SySlate \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/SySlate.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_BUNDLING=1 \
            clean archive

          echo "=== Injecting JS bundle into archive ==="
          cp $GITHUB_WORKSPACE/ios/SySlate/main.jsbundle \
            $RUNNER_TEMP/SySlate.xcarchive/Products/Applications/SySlate.app/
          cp -r $RUNNER_TEMP/rn-assets \
            $RUNNER_TEMP/SySlate.xcarchive/Products/Applications/SySlate.app/assets \
            2>/dev/null || true

          echo "=== Verifying bundle is present ==="
          ls $RUNNER_TEMP/SySlate.xcarchive/Products/Applications/SySlate.app/ | grep jsbundle

          cd $RUNNER_TEMP/SySlate.xcarchive/Products
          mv Applications Payload
          zip -r $RUNNER_TEMP/SySlate.ipa Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SySlate-unsigned
          path: ${{ runner.temp }}/SySlate.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ runner.temp }}/SySlate.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}