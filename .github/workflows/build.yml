name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      COCOAPODS_DISABLE_STATS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore npm cache
        id: npm
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Restore Pods cache
        id: pods
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'ios/Podfile', 'ios/Podfile.properties.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install dependencies (ccache installs alongside npm)
        id: install
        run: |
          sudo mdutil -a -i off > /dev/null 2>&1 || true
          brew install ccache > $RUNNER_TEMP/brew.log 2>&1 &
          BREW_PID=$!
          npm install --legacy-peer-deps --ignore-scripts --prefer-offline --no-audit --no-fund
          wait $BREW_PID || { cat $RUNNER_TEMP/brew.log; exit 1; }
          ccache --version | head -1

      - name: Patch react-native-screens iOS 26
        run: |
          grep -rl "usesNewAndroidHeaderHeightImplementation" node_modules/react-native-screens/ | while read f; do
            sed -i '' "s/'usesNewAndroidHeaderHeightImplementation' in compatibilityFlags/'usesNewAndroidHeaderHeightImplementation' in (compatibilityFlags || {})/g" "$f"
            echo "Patched: $f"
          done

      # The JS bundle and pod install do not depend on each other, so they run side by side.
      - name: Bundle JavaScript + install Pods (parallel)
        id: podsbundle
        run: |
          NODE_ENV=production node node_modules/.bin/react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/SySlate/main.jsbundle \
            --assets-dest $RUNNER_TEMP/rn-assets > $RUNNER_TEMP/bundle.log 2>&1 &
          BUNDLE_PID=$!

          if ! (cd ios && pod install); then
            echo "pod install failed, retrying with --repo-update"
            (cd ios && pod install --repo-update)
          fi

          if ! wait $BUNDLE_PID; then
            echo "=== JS bundle FAILED ==="
            cat $RUNNER_TEMP/bundle.log
            exit 1
          fi
          tail -n 15 $RUNNER_TEMP/bundle.log

      - name: Patch bundle for iOS 26
        run: |
          sed -i '' -E "s/'usesNewAndroidHeaderHeightImplementation'in ([a-zA-Z_\$]+)\.compatibilityFlags/'usesNewAndroidHeaderHeightImplementation'in (\1.compatibilityFlags||{})/g" ios/SySlate/main.jsbundle
          echo "Patch result:"
          grep -n "compatibilityFlags" ios/SySlate/main.jsbundle | head -5

      - name: Prepare Info.plist, icons and signing settings
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" ios/SySlate/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" ios/SySlate/Info.plist
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" ios/SySlate/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" ios/SySlate/Info.plist
          echo "Info.plist file sharing keys set"

          ICON="$GITHUB_WORKSPACE/icon.jpg"
          ICONSET="$GITHUB_WORKSPACE/ios/SySlate/Images.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sizes=(20 29 40 58 60 76 80 87 120 152 167 180 1024)
          for s in "${sizes[@]}"; do
            sips -z $s $s "$ICON" --out "$ICONSET/icon_${s}.png" 2>/dev/null
          done
          cat > "$ICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"icon_40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"icon_60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"icon_58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"icon_87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"icon_80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"icon_120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"icon_120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"icon_180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"icon_20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"icon_40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"icon_29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"icon_58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"icon_40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"icon_80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"icon_76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"icon_152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"icon_167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"icon_1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          EOF
          echo "Icons generated"

          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' SySlate.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          ccache -z
          cd ios
          # No "clean": the runner is fresh anyway, and it would throw away what ccache can reuse.
          xcrun xcodebuild \
            -workspace SySlate.xcworkspace \
            -scheme SySlate \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/SySlate.xcarchive \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            GENERATE_INFOPLIST_FILE=NO \
            SKIP_BUNDLING=1 \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_MODULE_DEBUGGING=NO \
            archive

          echo "=== Copying JS bundle into app ==="
          APP=$RUNNER_TEMP/SySlate.xcarchive/Products/Applications/SySlate.app
          cp $GITHUB_WORKSPACE/ios/SySlate/main.jsbundle $APP/main.jsbundle
          ls -la $APP/main.jsbundle

          cd $RUNNER_TEMP/SySlate.xcarchive/Products
          mv Applications Payload
          zip -qry $RUNNER_TEMP/SySlate.ipa Payload

      - name: ccache stats
        id: ccachestat
        if: ${{ !cancelled() }}
        run: |
          ccache -s || true
          # Skip re-uploading the cache when every compile was a hit (nothing new to store).
          MISS=$(ccache --print-stats 2>/dev/null | awk '$1=="cache_miss"{print $2}')
          if [ "$MISS" = "0" ]; then echo "save=false" >> $GITHUB_OUTPUT; else echo "save=true" >> $GITHUB_OUTPUT; fi

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SySlate-unsigned
          path: ${{ runner.temp }}/SySlate.ipa
          compression-level: 0
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ runner.temp }}/SySlate.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cache saves run last, so the IPA and release are already available while they upload.
      # ccache is saved even when the build failed; Pods and npm only when their own step succeeded.
      - name: Save ccache
        if: ${{ !cancelled() && steps.ccachestat.outputs.save != 'false' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Save Pods cache
        if: ${{ !cancelled() && steps.podsbundle.outcome == 'success' && steps.pods.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ios/Pods
            ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'ios/Podfile', 'ios/Podfile.properties.json') }}

      - name: Save npm cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.npm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
