name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable code signing in project
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' SySlate.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' SySlate.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          cd ios
          xcrun xcodebuild \
            -workspace SySlate.xcworkspace \
            -scheme SySlate \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/SySlate.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean archive

          cd $RUNNER_TEMP/SySlate.xcarchive/Products
          mv Applications Payload
          zip -r $RUNNER_TEMP/SySlate.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SySlate-unsigned
          path: ${{ runner.temp }}/SySlate.ipa